<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="PINN 局限示意图"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3fa"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#526173" stroke-width="1.5"/></marker></defs><rect width="1200" height="520" rx="22" fill="url(#bg)"/><text x="52" y="62" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#182433">Why vanilla PINN struggles</text><text x="52" y="94" font-family="Arial,sans-serif" font-size="17" fill="#617086">MLP maps each collocation point locally; physics couples the whole field.</text><g font-family="Arial,sans-serif"><rect x="55" y="150" width="245" height="250" rx="16" fill="#fff" stroke="#cfd9e6" stroke-width="2"/><text x="80" y="190" font-size="20" font-weight="700" fill="#d24b45">1 · Local mapping</text><circle cx="105" cy="265" r="10" fill="#df6d65"/><circle cx="160" cy="225" r="10" fill="#df6d65"/><circle cx="210" cy="315" r="10" fill="#df6d65"/><path d="M105 265 C130 245 135 235 160 225 M160 225 C185 250 190 280 210 315" fill="none" stroke="#e8b3af" stroke-width="2" stroke-dasharray="6 6"/><text x="80" y="365" font-size="16" fill="#617086">points communicate indirectly</text><rect x="345" y="150" width="245" height="250" rx="16" fill="#fff" stroke="#cfd9e6" stroke-width="2"/><text x="370" y="190" font-size="20" font-weight="700" fill="#c17a22">2 · Spectral bias</text><path d="M375 330 C410 320 410 250 450 275 S490 335 535 235" fill="none" stroke="#e3a848" stroke-width="4"/><path d="M375 330 C410 290 420 315 450 292 S500 275 535 255" fill="none" stroke="#cfd9e6" stroke-width="3" stroke-dasharray="7 7"/><text x="370" y="365" font-size="16" fill="#617086">high-frequency details fade</text><rect x="635" y="150" width="245" height="250" rx="16" fill="#fff" stroke="#cfd9e6" stroke-width="2"/><text x="660" y="190" font-size="20" font-weight="700" fill="#2e8b67">3 · Long rollout</text><path d="M665 315 C710 260 740 350 775 275 S830 330 855 245" fill="none" stroke="#3eaa82" stroke-width="4"/><path d="M665 315 C710 285 740 300 775 290 S830 295 855 280" fill="none" stroke="#cfd9e6" stroke-width="3" stroke-dasharray="7 7"/><text x="660" y="365" font-size="16" fill="#617086">small errors accumulate in time</text><rect x="925" y="150" width="220" height="250" rx="16" fill="#fff7f6" stroke="#e6aaa5" stroke-width="2"/><text x="950" y="190" font-size="20" font-weight="700" fill="#bd4944">Result</text><text x="950" y="245" font-size="18" fill="#3f4b5b">low average error</text><text x="950" y="285" font-size="18" fill="#3f4b5b">≠ correct derivatives</text><text x="950" y="325" font-size="18" fill="#3f4b5b">≠ stable rollout</text><path d="M300 275 H340 M590 275 H630 M880 275 H920" stroke="#526173" stroke-width="2" marker-end="url(#arrow)"/></g></svg>